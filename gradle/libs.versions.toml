[versions]
activity = "1.13.0"
agp = "8.13.2"
compose = "1.10.3"
kotlin = "2.3.20"
rikkaIcons = "0.1.0"
rikkaUi = "0.3.0"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "compose" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose" }
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose" }
compose-ui-tooling-preview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "compose" }
rikka-icons-core = { module = "dev.rikkaui.icons:core", version.ref = "rikkaIcons" }
rikka-icons-lucide = { module = "dev.rikkaui.icons:pack-lucide", version.ref = "rikkaIcons" }
rikka-icons-tokens-core = { module = "dev.rikkaui.icons:tokens-core", version.ref = "rikkaIcons" }
rikka-ui-foundation = { module = "dev.rikkaui:foundation", version.ref = "rikkaUi" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
